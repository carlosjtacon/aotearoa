<link href='/assets/modules/maplibre-gl.css' rel='stylesheet' />

<script src='/assets/modules/maplibre-gl.js'></script>
<script src="/assets/modules/chart.umd.min.js"></script>

<style>

	#map_{{include.id}}  {
		display: block;
		background: #000;
		height: 80vh;
		width: 80vw;
	}

</style>

<div id="map_{{include.id}}"></div>
<div id="waypoints"></div>

<script type="module">
	function prettyText(str) {
		let newStr = str.replace(/_/g , " ");
		return String(newStr).charAt(0).toUpperCase() + String(newStr).slice(1);
	}

	import { gpx } from "/assets/modules/togeojson.js";

	// NZ Position
	const startPos = [173, -40.5];
	const startZoom = 4;
	
	// vector layers
	const style = '/assets/data/topographic.json'
	// 'https://basemaps.linz.govt.nz/v1/tiles/topographic/WebMercatorQuad/style/topographic.json?api=d01hep5551e30kxb7w85hck49tp';
	
	var map = new maplibregl.Map({
		container: 'map_{{include.id}}', // container id
		style: style, // style URL
		center: startPos, // starting position [lng, lat]
		zoom: startZoom, // starting zoom
		interactive: {{include.interactive}}
	});
	
	map.on('load', async () => {
		console.log("{{include.gpx}}");
		
		fetch("{{include.gpx}}")
			.then(function(response) {
				return response.text();
			})
			.then(function(xml) {
				const geojson = gpx(new DOMParser().parseFromString(xml, "text/xml"));
				console.log(geojson)
				
				geojson.features.forEach(function(item, index, object) {
					// Remove routes from osmand
					if (item.properties._gpxType == "rte") {
						object.splice(index, 1);
					}
				});
					
				map.addSource('route', {
					'type': 'geojson',
					'data': geojson
				});
				
				// Draw the route lines
				map.addLayer({
					'id': 'route-line',
					'type': 'line',
					'source': 'route',
					'layout': {
						'line-join': 'round',
						'line-cap': 'round'
					},
					'paint': {
						'line-color': ['coalesce', ['get', 'gpxx_DisplayColor'], 'red'],
						'line-width': 5,
						'line-opacity': 0.75
					},
					'filter': ['==', '$type', 'LineString']
				});
				
				if ({{include.waypoints}}) {
					// Draw the route points
					map.addLayer({
						'id': 'route-points',
						'type': 'circle',
						'source': 'route',
						'paint': {
							'circle-radius': 6,
							'circle-color': ['coalesce',  ['get', 'osmand_color'], ["concat", "#", ['coalesce', ['get', 'mapout_color'], 'F00']]],
							'circle-opacity': 1,
							'circle-stroke-width': 2,
							'circle-stroke-color': "#FFF"
						},
						'filter': ['==', '$type', 'Point']
					});
					
					// Draw the route labels
					map.addLayer({
						'id': 'route-points-labels',
						'type': 'symbol',
						'source': 'route',
						'layout': {
							'text-field': ['get', 'name'],
							'text-font': ['Noto Sans Bold'],
							'text-size': 13,
							'text-offset': [0, 1],
							'text-anchor': 'top',
							'text-justify': 'auto'
						},
						'paint': {
							'text-color': ['coalesce',  ['get', 'osmand_color'], ["concat", "#", ['coalesce', ['get', 'mapout_color'], 'F00']]],
							'text-halo-color': '#FFF',
							'text-halo-width': 2
						},	
						'filter': ['==', '$type', 'Point']
					});
				}

				// Fit the map to the first line bounds
				// Geographic coordinates of the LineString
				// Create a 'LngLatBounds' with both corners at the first coordinate.
				// Extend the 'LngLatBounds' to include every coordinate in the bounds result.
				const coordinates = geojson.features[0].geometry.coordinates;
				const bounds = new maplibregl.LngLatBounds(coordinates[0], coordinates[0]);
				for (const coord of coordinates) {
					bounds.extend(coord);
				}
				map.fitBounds(bounds, {
					padding: 100
				});
				
				const marker_start = new maplibregl.Marker({color: "#13db3e"})
					.setLngLat([
						geojson.features[0].geometry.coordinates[0][0], 
						geojson.features[0].geometry.coordinates[0][1]
					]).addTo(map);
				const marker_end = new maplibregl.Marker({color: "#ff4944"})
					.setLngLat([
						geojson.features[0].geometry.coordinates.at(-1)[0], 
						geojson.features[0].geometry.coordinates.at(-1)[1]
					]).addTo(map);
					
				if ({{include.waypoints}}) {
					let waypointsHTML = ''
					geojson.features.forEach((element) => {
						if (element.geometry.type == "Point") {
							waypointsHTML += "<li style=\"color:" +element.properties.osmand_color+"\";><b>" + element.properties.name + " (" + prettyText(element.properties.osmand_amenity_subtype) + ")</b></li>";
						}
					})
					document.getElementById('waypoints').innerHTML = "<ul>" + waypointsHTML + "</ul>";
				}
			});
	});
		
</script>
