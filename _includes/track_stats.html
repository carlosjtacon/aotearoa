<link href='/assets/modules/maplibre-gl.css' rel='stylesheet' />

<script src='/assets/modules/maplibre-gl.js'></script>
<script src="/assets/modules/chart.umd.min.js"></script>

<style>
	
	#chart-container {
		height: 150px;
		width: 100%;
		z-index: 10;
		text-align: center;
	}
		
	#chart-inner-container {
		position: relative;
		margin: auto;
		height: 100%;
		width: 100%;
	}

</style>

<div>
	<span><div class="icon" style="background-image: url('/assets/icons/map.png')"></div> <span id="total_distance">-</span> km.</span>
	<span><div class="icon" style="background-image: url('/assets/icons/elevation_up.png')"></div> <span id="total_ascend">-</span> m.</span>
	<span><div class="icon" style="background-image: url('/assets/icons/elevation_down.png')"></div> <span id="total_descend">-</span> m.</span>
	<span class="button" style="float: right;"><a href="{{include.gpx}}" download>Download GPX</a></span>
</div>

<div id="chart-container">
	<div id="chart-inner-container">
		<canvas id="chart-canvas"></canvas>
	</div>
</div>

<script type="module">
	function coordinatesDistance(lat1, lon1, lat2, lon2) {
		// https://www.movable-type.co.uk/scripts/latlong.html
		const R = 6371e3; // metres
		const φ1 = lat1 * Math.PI/180; // φ, λ in radians
		const φ2 = lat2 * Math.PI/180;
		const Δφ = (lat2-lat1) * Math.PI/180;
		const Δλ = (lon2-lon1) * Math.PI/180;
		
		const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
				Math.cos(φ1) * Math.cos(φ2) *
				Math.sin(Δλ/2) * Math.sin(Δλ/2);
		const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
		
		const d = R * c; // in metres
		return d;
	}

	import { gpx } from "/assets/modules/togeojson.js";
	
	const elevation_chart = new Chart(document.getElementById('chart-canvas'), {
			type: 'line',
			data: {
				labels: [],
				datasets: []
			},
			options: {
				plugins: {
					legend: {
						display: false
					},
					title: {
						display:true,
						align: 'start',
						text: 'Elevation (m)'
					}
				},
				maintainAspectRatio: false,
				responsive: true,
				elements: {
					point: {
						radius: 0
					}
				}
			}
		});
	
	fetch("{{include.gpx}}")
		.then(function(response) {
			return response.text();
		})
		.then(function(xml) {
			const geojson = gpx(new DOMParser().parseFromString(xml, "text/xml"));
			console.log(geojson)
			
			// Draw elevation chart
			// get the elevation for the leading coordinate of each segment
			let elevations_full = [];
			let elevation_ascend = 0;
			let elevation_descend = 0;
			let labels_full =['0 km'];
			let total_distance = 0;
			let prevLat = null; 
			let prevLon = null;
			let prevElev = null;
			geojson.features[0].geometry.coordinates.forEach((element) => {
				
				elevations_full.push(element[2]);
				
				if (prevElev) {
					if (element[2] > prevElev) {
						elevation_ascend += element[2]-prevElev;
					} else {
						elevation_descend += prevElev-element[2];
					}
				}
				
				if (prevLat && prevLon) {
					total_distance += coordinatesDistance(prevLat, prevLon, element[0], element[1]);
					labels_full.push(Math.floor(total_distance/100)/10 + ' km');
				} 
				
				prevLat = element[0];
				prevLon = element[1];
				prevElev = element[2];
				
			});
			
			document.getElementById('total_ascend').innerHTML = Math.floor(elevation_ascend);
			document.getElementById('total_descend').innerHTML = Math.floor(elevation_descend);
			document.getElementById('total_distance').innerHTML = Math.floor(total_distance/100)/10;
			
			// Shrink down the elevations, to make the graph smoother
			let elevations = [];
			let labels = [];
			for (let i = 0; i < elevations_full.length; i+=10) {
				elevations.push(elevations_full[i]);
				labels.push(labels_full[i]);
			}
			
			// add dummy labels
			elevation_chart.data.labels = labels;
			elevation_chart.data.datasets[0] = {
				data: elevations,
				fill: true,
				tension: 0.4
			};
			elevation_chart.update();

		});
	
</script>
