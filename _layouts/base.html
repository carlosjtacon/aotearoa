<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    <link rel="apple-touch-icon" href="/assets/images/favicon.png">
    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <link rel="alternate" type="application/rss+xml" href="{{ site.url }}/feed.xml">

    <!-- Not sure why this makes the font not work -->
    <!-- <link rel="preload" href="/assets/fonts/MPLUS1.woff2" as="font" type="font/woff2" crossorigin> -->
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/theme/{{page.theme}}.css">
    <script src="/assets/javascript/main.js"></script>

    {%- if page.File %}
    {% comment %} Photo {% endcomment %}
    <meta property="og:title" content="{{page.Title}}">
    <meta property="og:description" content="{{page.DateTimeOriginal | date: "%b %d %Y"}}, {{page.GPSLatitude}}{{page.GPSLatitudeRef}} {{page.GPSLongitude}}{{page.GPSLongitudeRef}}">
    <meta property="og:image" content="{{site.url}}/assets/photos/thumbs/{{page.File | split: "." | first | uri_escape }}-thumb.webp">
    {%- endif %}
    {%- if page.gpx_path %}
    {% comment %} Track {% endcomment %}
    <meta property="og:title" content="{{page.title}}">
    <meta property="og:description" content="{{page.gpx_path}}">
    {%- endif %}
    {%- if page.gpx_filename %}
    {% comment %} Logbook {% endcomment %}
    <meta property="og:title" content="{{page.title}}">
    <meta property="og:description" content="{{page.content | strip_html | normalize_whitespace | truncate: 100}}">
    <meta property="og:image" content="{{site.url}}/assets/photos/thumbs/{{page.thumbnail}}-thumb.webp">
    {%- endif %}

    <meta property="og:url" content="{{site.url}}{{page.url}}">
  </head>
  <body>
    {{ content }}
  </body>
  <script>
    document.addEventListener("keydown", ({key}) => {
        switch (key) {
            case 'ArrowRight':
            document.getElementById("navNext").click();
            break;
            case 'ArrowLeft':
            document.getElementById("navPrev").click();
            break;
        }
    });
</script>
</html>
